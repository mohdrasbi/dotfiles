# -- General --
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#S / #W"
set -g display-time 2000
set -g display-panes-time 2000

# -- Status bar --
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#a0a0a0"
set -g status-left-length 40
set -g status-left "#[fg=#ce2156,bold]#S #[default]│ "
set -g status-right-length 80
set -g status-right "#[fg=#a0a0a0]#{cpu_percentage} cpu │ #{ram_percentage} mem │ #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') │ %H:%M"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#ce2156,bold] #I:#W "
setw -g window-status-separator ""

# -- Panes --
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#ce2156"

# -- Copy mode --
setw -g mode-keys vi
set -g copy-command "pbcopy"
setw -g mode-style "bg=#2a323a,fg=#ffffff"

# -- Messages --
set -g message-style "bg=default,fg=#ce2156"

# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Plugin display settings
set -g @cpu_percentage_format "%2.0f%%"
set -g @ram_percentage_format "%2.0f%%"

# Initialize TPM (must be last)
run '~/.tmux/plugins/tpm/tpm'
